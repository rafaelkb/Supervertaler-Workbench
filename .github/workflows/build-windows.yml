name: Build Windows Release

# Builds a ready-to-download Supervertaler ZIP (PyInstaller EXE) on GitHub's
# Windows runners, so you don't have to compile locally.
#
# Triggers:
#   - push of a tag starting with v  -> builds + publishes a GitHub Release
#                                      with the ZIP as a release asset
#   - push to main / this branch     -> builds + uploads the ZIP as a
#                                      workflow artifact (downloadable from
#                                      the Actions page)
#   - manual (workflow_dispatch)     -> same as branch push
#
# Notes:
#   * The EXE is NOT code-signed (GitHub runners have no signing certificate),
#     so Windows may show a SmartScreen warning on first run. Click
#     "More info -> Run anyway".
#   * The okapi-sidecar (Okapi file filters) is built as part of the job so
#     the full feature set ships in the bundle.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - arena/fcd42721-supervertaler-workbench
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: Build Supervertaler for Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python (for PyInstaller + the app) ───────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ── Java 17 + Maven (okapi-sidecar fat JAR + JRE bundle) ─
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Maven (choco)
        shell: pwsh
        run: choco install maven -y

      # Build okapi-sidecar/dist/{okapi-sidecar.jar, jre/} so the
      # PyInstaller spec's `datas` resolve (referenced by Supervertaler.spec).
      - name: Build okapi-sidecar dist bundle
        shell: bash
        run: ./okapi-sidecar/build.sh --jlink

      # ── Build Supervertaler EXE + ZIP ────────────────────────
      # Reuses the same script used for local releases
      # (build_windows_release.ps1): venv, deps, PyInstaller, copies
      # user_data/translations/shortcut helpers, then create_release_zip.py.
      - name: Build Supervertaler (PyInstaller + ZIP)
        shell: pwsh
        run: .\build_windows_release.ps1

      # ── Read version from pyproject.toml ─────────────────────
      - name: Get version
        shell: pwsh
        id: version
        run: |
          $content = Get-Content -Raw -Encoding UTF8 pyproject.toml
          $m = [regex]::Match($content, 'version\s*=\s*"([^"]+)"')
          $ver = if ($m.Success) { $m.Groups[1].Value } else { 'unknown' }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "zip=dist/Supervertaler-v$ver-Windows.zip" >> $env:GITHUB_OUTPUT

      # ── Always publish a workflow artifact (downloadable) ────
      - name: Upload Windows ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Supervertaler-Windows-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.zip }}
          if-no-files-found: error
          retention-days: 90

      # ── On tagged pushes, also publish a GitHub Release ──────
      - name: Create GitHub Release and upload ZIP asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ steps.version.outputs.zip }}"
          $releaseExists = $false
          gh release view "$tag" --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          if (-not $releaseExists) {
            gh release create "$tag" `
              --title "Supervertaler $tag" `
              --generate-notes
          }
          gh release upload "$tag" "$zip" --clobber
          Write-Host "Release asset ready: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" -ForegroundColor Green
